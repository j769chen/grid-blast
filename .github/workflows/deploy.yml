name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel for the phone apps
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CHANNEL: ${{ inputs.channel || 'preview' }}
    steps:
      - name: Check for EXPO_TOKEN
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret from https://expo.dev/settings/access-tokens"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish update to ${{ env.CHANNEL }}
        run: eas update --channel "$CHANNEL" --environment "$CHANNEL" --message "$(git log -1 --pretty=%s)" --non-interactive
      - name: Export web
        run: npx expo export -p web
      - name: Deploy web
        run: eas deploy --prod --non-interactive

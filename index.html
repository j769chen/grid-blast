<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Blast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="best" title="Best score">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 8l4.5 3.5L12 5l4.5 6.5L21 8l-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2" rx="1" fill="currentColor"/></svg>
      <span id="best">0</span>
    </div>
    <div class="score" id="score" aria-live="polite">0</div>
    <div class="tools">
      <button class="icon-btn" id="sound" type="button" aria-label="Sound on"></button>
      <button class="icon-btn" id="restart" type="button" aria-label="New game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      </button>
    </div>
  </header>

  <div class="board" id="board">
    <div class="cells" id="cells"></div>
    <div class="fx" id="fx"></div>
  </div>

  <div class="tray" id="tray" aria-label="Pieces">
    <div class="slot" data-i="0"></div>
    <div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div>
  </div>

  <div class="ghost" id="ghost" hidden></div>

  <div class="over" id="over" hidden>
    <div class="card" role="dialog" aria-labelledby="overTitle">
      <p class="eyebrow" id="overTitle">No room left</p>
      <p class="final" id="final">0</p>
      <p class="best-line">Best <span id="finalBest">0</span></p>
      <p class="newbest" id="newBest" hidden>New best score!</p>
      <button class="btn" id="again" type="button">Play again</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Overclock feature graphic</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        background: #052b1c;
      }
      .card {
        position: relative;
        width: 1024px;
        height: 500px;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 56px;
        padding: 0 72px;
        box-sizing: border-box;
        background: radial-gradient(circle at 30% 20%, #146b46 0%, #0b4a30 45%, #052b1c 100%);
        font-family: 'Chakra Petch', sans-serif;
      }
      .traces {
        position: absolute;
        inset: 0;
      }
      .icon {
        position: relative;
        width: 300px;
        height: 300px;
        border-radius: 66px;
        box-shadow:
          0 0 0 2px rgba(212, 173, 98, 0.55),
          0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .text {
        position: relative;
      }
      h1 {
        margin: 0;
        font-size: 92px;
        line-height: 1;
        letter-spacing: 1px;
        color: #eef2e6;
        text-shadow: 0 0 28px rgba(255, 226, 161, 0.35);
      }
      p {
        margin: 18px 0 0;
        font-size: 34px;
        font-weight: 600;
        color: #d4ad62;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="traces" viewBox="0 0 1024 500" fill="none" stroke="rgba(212,173,98,0.18)" stroke-width="5">
        <path d="M0 70h220l40 40h180" />
        <path d="M1024 420H780l-40-40H560" />
        <path d="M640 0v60l40 40h344" />
        <path d="M0 440h120l40-40h120" />
        <circle cx="440" cy="110" r="10" />
        <circle cx="560" cy="380" r="10" />
        <circle cx="680" cy="100" r="10" />
      </svg>
      <img class="icon" src="../assets/icon.png" alt="" />
      <div class="text">
        <h1>Overclock</h1>
        <p>Clear lines. Wire circuits.</p>
      </div>
    </div>
  </body>
</html>
